# Package of a release: on a release tag vX.Y.Z, run the tests for the tagged commit (test.yml),
# build the sdist and the wheel, attest them (build provenance, CycloneDX SBOM), upload them to
# PyPI and attach them with the SBOM to a GitHub release.
#
# Manual fallback, should GitHub not start the workflow for a pushed tag: Actions → release →
# Run workflow, "Use workflow from" the tag and the same tag as input `tag`. Anything else is
# refused (job `tag`): the run must be on the tag itself, so that the tests, the package and the
# attestations all name it.
#
# Supply chain: every action is pinned to a full commit SHA (the comment names its version;
# Dependabot proposes updates), the build tools by version in pyproject.toml. The upload is a
# PyPI trusted publisher: this file, in the GitHub environment `pypi`, with the workflow's OIDC
# token and no stored secret. The publish action adds PEP 740 attestations on PyPI; verify the
# GitHub attestations with `gh attestation verify <file> --repo <this repository>`.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag vX.Y.Z (choose the same tag under \"Use workflow from\")"
        required: true
        type: string

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Existing release tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$TAG is not a release tag vX.Y.Z" >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "run this workflow from the tag $TAG (\"Use workflow from\" → Tags → $TAG), not from $GITHUB_REF" >&2
            exit 1
          fi

  test:
    needs: tag
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}  # the release tag (job `tag`)
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m venv /tmp/tools
          /tmp/tools/bin/pip install --disable-pip-version-check ".[release]"
          /tmp/tools/bin/python -m build

      - name: Version of the package is the tag
        run: |
          test -f "dist/camt_reader-${GITHUB_REF_NAME#v}-py3-none-any.whl"
          test -f "dist/camt_reader-${GITHUB_REF_NAME#v}.tar.gz"

      - name: SBOM of the wheel and what it installs
        run: |
          python -m venv --without-pip /tmp/installed
          python -m pip --disable-pip-version-check --python /tmp/installed/bin/python install dist/*.whl
          mkdir sbom
          /tmp/tools/bin/cyclonedx-py environment --output-format JSON --output-file sbom/camt-reader.cdx.json /tmp/installed

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.whl
          sbom-path: sbom/camt-reader.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/

      - name: GitHub release with the package and its SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/dist/* artifacts/sbom/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md."
